<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- On iOS, src/lib/shell/viewport.ts adds maximum-scale=1 so focusing
		     a field with text under 16 px does not zoom the page. Keep this
		     equal to VIEWPORT there. -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<!-- PWA (#11). theme-color is --surface-shell (#22); keep it equal to
		     THEME_COLOR in src/lib/pwa/manifest.ts. -->
		<meta name="theme-color" content="#0d131b" />
		<meta name="color-scheme" content="dark" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
		<title>Docker Manager</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background: #0a0f15">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
