<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- Maskable variant of static/icons/icon.svg (#22): full-bleed
	     shell surface colour, the cube inside the 80 % safe circle so any launcher
	     mask (circle, squircle, teardrop) keeps it whole. -->
	<defs>
		<radialGradient id="glow" cx="50%" cy="48%" r="42%">
			<stop offset="0" stop-color="#2566fd" stop-opacity=".30"/>
			<stop offset="1" stop-color="#2566fd" stop-opacity="0"/>
		</radialGradient>
	</defs>
	<rect width="512" height="512" fill="#0e141d"/>
	<rect width="512" height="512" fill="url(#glow)"/>
	<g transform="translate(256 260) scale(9.5) translate(-14 -14)">
		<path d="M14 2.5 24.5 8.5 14 14.5 3.5 8.5Z" fill="#5b92fd"/>
		<path d="M3.5 8.5 14 14.5v11L3.5 19.5Z" fill="#2566fd"/>
		<path d="M24.5 8.5 14 14.5v11l10.5-6Z" fill="#1d4fd0"/>
		<path d="M14 14.5v11" stroke="#0b1016" stroke-opacity=".35" stroke-width=".5"/>
		<path d="M3.5 8.5 14 14.5 24.5 8.5" fill="none" stroke="#9fc0ff" stroke-opacity=".45" stroke-width=".35" stroke-linejoin="round"/>
	</g>
</svg>
