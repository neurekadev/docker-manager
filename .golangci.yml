# golangci-lint v2 configuration. Pinned tool version: v2.13.2
# (CI: golangci/golangci-lint-action with version v2.13.2; locally the same).
version: "2"

run:
  go: "1.27"
  timeout: 5m
  tests: true
  # Lint the Docker-backed test harness too (it only builds with the tag).
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        legacy-docker:
          files:
            - $all
          deny:
            - pkg: github.com/docker/docker
              desc: use github.com/moby/moby/client and /api through the agent Engine adapter (#21)
            - pkg: github.com/fsouza/go-dockerclient
              desc: use github.com/moby/moby/client through the agent Engine adapter (#21)
            - pkg: github.com/mattn/go-sqlite3
              desc: DockYard is CGO-free; use bun/driver/sqliteshim (modernc.org/sqlite)
        # Only the two agent adapters (and the CI test harness) may use the
        # Engine, Compose, BuildKit and docker/cli SDKs (#21). Everything else
        # goes through internal/agent/engine's domain-neutral interface.
        sdk-boundary:
          files:
            - $all
            - "!**/internal/agent/engine/**"
            - "!**/internal/agent/compose/**"
            - "!**/internal/testharness/**"
            - "!**/test/**"
            # Integration tests drive the harness fixtures, whose options use SDK types.
            - "!**/*integration_test.go"
          deny:
            - pkg: github.com/moby/moby/client
              desc: only internal/agent/engine talks to the Engine (#21)
            - pkg: github.com/moby/moby/api
              desc: SDK types stay inside internal/agent/engine (#21)
            - pkg: github.com/docker/compose
              desc: only internal/agent/compose uses the Compose SDK (#21)
            - pkg: github.com/docker/cli
              desc: only internal/agent/compose uses docker/cli, in memory (#19, #21)
            - pkg: github.com/moby/buildkit
              desc: builds go through internal/agent/engine (#21, #33)
            - pkg: github.com/compose-spec/compose-go
              desc: Compose models stay inside internal/agent/compose (#21)
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use log/slog (or write to an injected io.Writer in cmd/)
        - pattern: ^print(ln)?$
          msg: use log/slog
        # No Docker/Compose/buildx CLI or credential helpers (#21): process
        # execution is limited to the paths excluded below (see
        # docs/architecture/engine-integration.md); add restic's runner there
        # when it lands (#10).
        - pattern: ^exec\.(Command|CommandContext|LookPath)$
          pkg: ^os/exec$
          msg: the agent never executes Docker, Compose, buildx or credential-helper binaries; use the Engine/Compose SDK adapters (#21)
      analyze-types: true
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this with better exclusions
        - G304 # file inclusion via variable: paths come from operator config; containment is enforced by the file manager (#15)
        - G306 # WriteFile perms: reviewed per call
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over struct packing
        - shadow # too noisy for err shadowing idioms
    misspell:
      locale: US
      # Job states and routes use "cancelled"/"cancelling" (#4, #26 API values).
      ignore-rules:
        - cancelled
        - cancelling
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - revive
      # Command entry points write user-facing output directly.
      - path: ^cmd/
        linters:
          - forbidigo
      # Test fixture programs (run inside test containers) print to stdout and
      # take paths from their arguments by design.
      - path: ^test/fixtures/
        linters:
          - forbidigo
          - gosec
      # Process execution is allowed only in tests (subprocess crash tests,
      # git/restic in fixtures) and in the CI test harness (git fixtures).
      - path: (_test\.go$|^internal/testharness/)
        text: exec\.(Command|CommandContext|LookPath)
        linters:
          - forbidigo
    paths:
      - web/node_modules

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - web/node_modules
