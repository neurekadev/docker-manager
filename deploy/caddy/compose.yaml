# DockYard behind Caddy: manager + co-located agent + TLS reverse proxy.
#
#   cp .env.example .env      # set DOCKYARD_HOST etc.
#   docker compose up -d
#
# One public origin (https://${DOCKYARD_HOST}) serves the UI, /api/v1 and
# /agent/v1 (#27). The co-located agent talks to the manager over the
# internal network with an explicit plain-HTTP opt-in; agents on other hosts
# use deploy/remote-agent with the public HTTPS origin. Only named volumes
# plus the agent's identical-path mount of Docker's volume directory are used
# (#28). See docs/deployment.md.
name: dockyard

services:
  dockyard-manager:
    image: code.neureka.dev/dockyard/dockyard-manager:edge
    restart: unless-stopped
    environment:
      DOCKYARD_PUBLIC_URL: https://${DOCKYARD_HOST:-localhost}
      # Only the proxy's X-Forwarded-For/Proto/Host headers are honored
      # (client IP for rate limits and audit, https for first-run setup).
      DOCKYARD_TRUSTED_PROXIES: ${DOCKYARD_PROXY_IP:-10.227.27.10}
      DOCKYARD_LOG_LEVEL: ${DOCKYARD_LOG_LEVEL:-info}
    volumes:
      - dockyard_data:/var/lib/dockyard
    labels:
      dev.neureka.dockyard.role: manager
    networks:
      - dockyard

  dockyard-agent:
    image: code.neureka.dev/dockyard/dockyard-agent:edge
    restart: unless-stopped
    depends_on:
      - dockyard-manager
    environment:
      # Internal URL on this Docker network: no proxy hop, plain HTTP with
      # the explicit opt-in (flagged on the host page, #27).
      DOCKYARD_MANAGER_URL: http://dockyard-manager:8080
      DOCKYARD_MANAGER_ALLOW_HTTP: "true"
      DOCKYARD_ENROLLMENT_TOKEN: ${DOCKYARD_ENROLLMENT_TOKEN:-}
      DOCKYARD_ENVIRONMENT_NAME: ${DOCKYARD_ENVIRONMENT_NAME:-}
      DOCKYARD_LOG_LEVEL: ${DOCKYARD_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Identical-path mount: stack and volume paths resolve the same inside
      # the agent and on the Engine (#28). Do not change either side. The
      # agent verifies this at startup and disables stack operations with a
      # diagnostic otherwise. Custom Docker data root (`docker info -f
      # '{{.DockerRootDir}}'`): replace /var/lib/docker on both sides here and
      # below. SELinux hosts: see docs/deployment.md.
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      # Ensures the stacks volume exists; it is the same directory the
      # identical-path mount above already exposes.
      - dockyard_stacks:/var/lib/docker/volumes/dockyard_stacks/_data
      - dockyard_agent_state:/var/lib/dockyard-agent
    labels:
      dev.neureka.dockyard.role: agent
    networks:
      - dockyard

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      - dockyard-manager
    ports:
      - "${DOCKYARD_HTTP_PORT:-80}:80"
      - "${DOCKYARD_HTTPS_PORT:-443}:443"
      - "${DOCKYARD_HTTPS_PORT:-443}:443/udp"
    environment:
      DOCKYARD_HOST: ${DOCKYARD_HOST:-localhost}
      DOCKYARD_TLS: ${DOCKYARD_TLS:-internal}
      DOCKYARD_MAX_BODY_SIZE: ${DOCKYARD_MAX_BODY_SIZE:-1GB}
      DOCKYARD_PROXY_READ_TIMEOUT: ${DOCKYARD_PROXY_READ_TIMEOUT:-60s}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      dockyard:
        # Fixed address so the manager can trust exactly this proxy.
        ipv4_address: ${DOCKYARD_PROXY_IP:-10.227.27.10}

volumes:
  dockyard_data:
  dockyard_agent_state:
  # Stack project directories (#28). A fixed name so the agent finds it at
  # /var/lib/docker/volumes/dockyard_stacks/_data regardless of project name.
  dockyard_stacks:
    name: dockyard_stacks
  caddy_data:
  caddy_config:

networks:
  dockyard:
    ipam:
      config:
        # Change (with DOCKYARD_PROXY_IP) if it overlaps a network on your host.
        - subnet: ${DOCKYARD_SUBNET:-10.227.27.0/24}
