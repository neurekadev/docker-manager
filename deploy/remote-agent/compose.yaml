# A Docker Agent on another Docker host (#27). It dials out to the
# manager's single public HTTPS origin, the same one browsers use, through
# whichever reverse proxy fronts the manager (deploy/caddy, deploy/traefik or
# deploy/nginx). It opens no port.
#
#   cp .env.example .env      # DOCKER_AGENT_MANAGER_URL and the enrollment token
#   docker compose up -d
#
# Only named volumes plus the identical-path mount of Docker's volume
# directory are used (#28). See docs/internal/deployment.md. The project name is
# "docker-manager" as in the manager examples, so the volumes are docker-manager_agent
# (agent state), docker-manager_stacks (the agent's default DOCKER_AGENT_STACKS_VOLUME)
# and docker-manager_agent_ca.
name: docker-manager

services:
  docker-agent:
    image: code.neureka.dev/docker-manager/docker-agent:edge
    restart: unless-stopped
    environment:
      # The public origin, always https (certificate validated against the
      # system roots plus DOCKER_AGENT_MANAGER_CA_FILE if set). Never set
      # DOCKER_AGENT_MANAGER_ALLOW_HTTP here.
      DOCKER_AGENT_MANAGER_URL: ${DOCKER_AGENT_MANAGER_URL:-https://docker.example.com}
      DOCKER_AGENT_MANAGER_CA_FILE: ${DOCKER_AGENT_MANAGER_CA_FILE:-}
      DOCKER_AGENT_ENROLLMENT_TOKEN: ${DOCKER_AGENT_ENROLLMENT_TOKEN:-}
      DOCKER_AGENT_ENVIRONMENT_NAME: ${DOCKER_AGENT_ENVIRONMENT_NAME:-}
      DOCKER_AGENT_LOG_LEVEL: ${DOCKER_AGENT_LOG_LEVEL:-info}
    # Host metrics (#5): CPU, memory, load and uptime are host-wide as is;
    # network rates cover only the agent container unless you uncomment
    # this (it shows every host process to the agent). See
    # docs/internal/architecture/metrics.md, "Host telemetry".
    # pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Identical-path mount: stack and volume paths resolve the same inside
      # the agent and on the Engine (#28). Do not change either side. The
      # agent verifies this at startup and disables stack operations with a
      # diagnostic otherwise. Custom Docker data root (`docker info -f
      # '{{.DockerRootDir}}'`): replace /var/lib/docker on both sides here and
      # below. SELinux hosts: see docs/internal/deployment.md.
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - stacks:/var/lib/docker/volumes/docker-manager_stacks/_data
      - agent:/var/lib/docker-agent
      # Optional: import existing Compose projects from another directory
      # (Stacks > Import project moves them into the stacks volume). Mount it
      # below /import, read-only is enough; remove it when you are done.
      # - /opt/stacks:/import:ro
      # Private PKI: a named volume holding the CA bundle, e.g.
      #   docker run --rm -v docker-manager_agent_ca:/ca -v "$PWD":/src alpine cp /src/ca.pem /ca/
      # then set DOCKER_AGENT_MANAGER_CA_FILE=/etc/docker-manager/ca/ca.pem.
      - agent_ca:/etc/docker-manager/ca:ro
    labels:
      dev.neureka.docker-manager.role: agent

volumes:
  agent:
  stacks:
  agent_ca:
