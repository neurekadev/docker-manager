# DockYard behind Traefik: manager + co-located agent + TLS reverse proxy.
#
#   cp .env.example .env      # set DOCKYARD_HOST and the TLS mode
#   docker compose up -d
#
# Traefik uses its file provider (dynamic/dockyard.yml) instead of Docker
# labels, so the proxy needs no Docker socket. One public origin serves the
# UI, /api/v1 and /agent/v1 (#27); agents on other hosts use
# deploy/remote-agent. Only named volumes plus the agent's identical-path
# mount are used (#28). See docs/deployment.md.
name: dockyard

services:
  dockyard-manager:
    image: ghcr.io/neurekadev/dockyard-manager:edge
    restart: unless-stopped
    environment:
      DOCKYARD_PUBLIC_URL: https://${DOCKYARD_HOST:-localhost}
      DOCKYARD_TRUSTED_PROXIES: ${DOCKYARD_PROXY_IP:-10.227.27.10}
      DOCKYARD_LOG_LEVEL: ${DOCKYARD_LOG_LEVEL:-info}
    volumes:
      - dockyard_data:/var/lib/dockyard
    labels:
      dev.neureka.dockyard.role: manager
    networks:
      - dockyard

  dockyard-agent:
    image: ghcr.io/neurekadev/dockyard-agent:edge
    restart: unless-stopped
    depends_on:
      - dockyard-manager
    environment:
      DOCKYARD_MANAGER_URL: http://dockyard-manager:8080
      DOCKYARD_MANAGER_ALLOW_HTTP: "true"
      DOCKYARD_ENROLLMENT_TOKEN: ${DOCKYARD_ENROLLMENT_TOKEN:-}
      DOCKYARD_ENVIRONMENT_NAME: ${DOCKYARD_ENVIRONMENT_NAME:-}
      DOCKYARD_LOG_LEVEL: ${DOCKYARD_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - dockyard_stacks:/var/lib/docker/volumes/dockyard_stacks/_data
      - dockyard_agent_state:/var/lib/dockyard-agent
    labels:
      dev.neureka.dockyard.role: agent
    networks:
      - dockyard

  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    depends_on:
      - dockyard-manager
    # Static configuration. e2e/compose.yaml runs the same arguments
    # (TestTraefikArgumentsMatchE2E).
    command:
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      # Traefik v3 defaults readTimeout to 60 s, which ends SSE and WebSocket
      # streams after a minute; streams keep themselves alive with heartbeats.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=false
      - --certificatesResolvers.letsencrypt.acme.email=${DOCKYARD_ACME_EMAIL:-}
      - --certificatesResolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesResolvers.letsencrypt.acme.tlsChallenge=true
      - --log.level=INFO
    ports:
      - "${DOCKYARD_HTTP_PORT:-80}:80"
      - "${DOCKYARD_HTTPS_PORT:-443}:443"
    environment:
      # Read by the templates in dynamic/dockyard.yml.
      DOCKYARD_HOST: ${DOCKYARD_HOST:-localhost}
      DOCKYARD_TLS_CERT_FILE: ${DOCKYARD_TLS_CERT_FILE:-}
      DOCKYARD_TLS_KEY_FILE: ${DOCKYARD_TLS_KEY_FILE:-}
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/acme
      # Own certificates (DOCKYARD_TLS_CERT_FILE/KEY_FILE point below /certs).
      - ${DOCKYARD_TLS_DIR:-./certs}:/certs:ro
    networks:
      dockyard:
        ipv4_address: ${DOCKYARD_PROXY_IP:-10.227.27.10}

volumes:
  dockyard_data:
  dockyard_agent_state:
  dockyard_stacks:
    name: dockyard_stacks
  traefik_acme:

networks:
  dockyard:
    ipam:
      config:
        - subnet: ${DOCKYARD_SUBNET:-10.227.27.0/24}
