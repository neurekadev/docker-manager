# Docker Manager route for Traefik's file provider (#27). Traefik renders this
# file as a Go template: env reads the Traefik container's environment.
#
# TLS: with DOCKER_MANAGER_TLS_CERT_FILE/DOCKER_MANAGER_TLS_KEY_FILE set, Traefik serves
# that certificate (mount it below /certs); otherwise it obtains one from
# Let's Encrypt (resolver "letsencrypt", DOCKER_MANAGER_ACME_EMAIL, the host must be
# publicly reachable on port 443).
#
# Traefik serves HTTP/2 to browsers on TLS entry points by default, streams
# SSE and WebSocket traffic, passes the Host header through and replaces
# client-supplied X-Forwarded-* headers with its own (no forwardedHeaders
# trust is configured). Request bodies are not limited by default; the
# manager enforces its own upload limits (#15).
http:
  routers:
    docker-manager:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "DOCKER_MANAGER_HOST" }}`)'
      service: docker-manager
{{- if env "DOCKER_MANAGER_TLS_CERT_FILE" }}
      tls: {}
{{- else }}
      tls:
        certResolver: letsencrypt
{{- end }}

    # Optional: allow the agent endpoint only from known networks. Copy the
    # tls block of the router above; the longer rule takes precedence.
    # docker-agent-endpoint:
    #   entryPoints: [websecure]
    #   rule: 'Host(`docker.example.com`) && PathPrefix(`/agent/v1`)'
    #   middlewares: [agent-allowlist]
    #   service: docker-manager
    #   tls: {}

  # middlewares:
  #   agent-allowlist:
  #     ipAllowList:
  #       sourceRange: ["192.0.2.0/24", "2001:db8::/32"]

  services:
    docker-manager:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://docker-manager:8080
{{- if env "DOCKER_MANAGER_TLS_CERT_FILE" }}

tls:
  stores:
    default:
      defaultCertificate:
        certFile: '{{ env "DOCKER_MANAGER_TLS_CERT_FILE" }}'
        keyFile: '{{ env "DOCKER_MANAGER_TLS_KEY_FILE" }}'
{{- end }}
