# User documentation site (docs/public): builds the static-site image and
# publishes ghcr.io/neurekadev/docker-manager-docs:edge from main. The
# Docker build runs the site build; there is no separate Node job. Like
# CI.yaml, linux/amd64 and linux/arm64 build on their native runners.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/public/**"
      - ".github/workflows/Docs.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/neurekadev/docker-manager-docs

jobs:
  build:
    name: Build Image ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: ARM64
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log In to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=docker-manager-docs
            org.opencontainers.image.source=https://github.com/neurekadev/docker-manager
            org.opencontainers.image.version=0.0.0-edge
      - name: Build and Push Image Digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docs/public
          file: docs/public/Dockerfile
          build-args: |
            GIT_TAG=0.0.0-edge
            GIT_HASH=${{ github.sha }}
            DOCS_BASE_PATH=/docker-manager
            DOCS_SITE_URL=https://docs.neureka.dev
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=docs-${{ matrix.arch }}
          cache-to: type=gha,scope=docs-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Export Image Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:?*) ;;
            *) echo "::error::build-push-action returned no digest"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload Image Digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Docs
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Image Digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Log In to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create Multi-Platform Manifest
        run: |
          args=(--tag "${IMAGE}:edge"
            --annotation "index:org.opencontainers.image.title=docker-manager-docs"
            --annotation "index:org.opencontainers.image.source=https://github.com/neurekadev/docker-manager"
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}")
          for digest in "$RUNNER_TEMP"/digests/*; do
            args+=("${IMAGE}@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Verify Published Platforms
        run: |
          docker buildx imagetools inspect "${IMAGE}:edge"
          manifest="$(docker buildx imagetools inspect "${IMAGE}:edge" --format '{{json .Manifest}}')"
          jq -e '[.manifests[].platform | select(. != null) | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' <<<"$manifest"
