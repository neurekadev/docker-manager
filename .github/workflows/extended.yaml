# Extended suites (#29): slower or Docker-backed tests. Runs on every push to
# main, nightly (full matrix: every Engine in test/matrix/engines.json on
# amd64 and arm64), and on demand:
#
#   gh workflow run extended.yaml --ref <branch> -f suites=fuzz,e2e
#
# Each suite is its own job gated on the `suites` input ("all" or a
# comma-separated list of job names). Every tagged Go test is selected by
# some job here (test/verification checks the -run filters and tags), and
# docs/testing/verification-matrix.md maps every #12 item to its job.
# How to run each suite locally: docs/testing/harness.md.
name: extended

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites: "all" or a comma-separated list without spaces of race,fuzz,engine-matrix,compose-fixtures,storage,fs-security,fault-injection,secret-canary,e2e,e2e-devstack,smoke,metrics-budget'
        type: string
        default: all
      fuzztime:
        description: "fuzz: -fuzztime per target"
        type: string
        default: 60s
      arm64:
        description: "engine-matrix: also run on ubuntu-24.04-arm (auto = yes unless the DOCKYARD_ARM64_RUNNERS variable is false)"
        type: choice
        options: [auto, "true", "false"]
        default: auto
      smoke-images:
        description: "smoke: auto (edge on main, locally built elsewhere), edge, or local"
        type: choice
        options: [auto, edge, local]
        default: auto
      smoke-revision:
        description: "smoke: expected revision of the edge images (default: the commit of this run)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # bash -eo pipefail (the implicit default shell lacks pipefail).
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine matrix and runners
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SUITES: ${{ github.event_name == 'workflow_dispatch' && inputs.suites || 'all' }}
          ARM64_INPUT: ${{ inputs.arm64 }}
          ARM64_VAR: ${{ vars.DOCKYARD_ARM64_RUNNERS }}
        run: |
          engines="$(jq -c '[.engines[].version]' test/matrix/engines.json)"
          echo "engines=${engines}" >> "$GITHUB_OUTPUT"
          # arm64: GitHub-hosted ubuntu-24.04-arm runners were verified for
          # this private repository on 2026-09-24. A job for an unavailable
          # label would queue instead of failing, so availability is a
          # repository switch: DOCKYARD_ARM64_RUNNERS=false falls back to
          # amd64 only. Pushes to main run amd64 only to save minutes; the
          # nightly schedule and manual runs cover both architectures.
          arm=true
          reason=""
          if [ "${ARM64_VAR}" = "false" ]; then
            arm=false; reason="repository variable DOCKYARD_ARM64_RUNNERS=false (arm64 runners marked unavailable)"
          elif [ "${ARM64_INPUT}" = "false" ]; then
            arm=false; reason="disabled by the arm64 input"
          elif [ "${EVENT}" = "push" ]; then
            arm=false; reason="pushes to main run amd64 only; the nightly schedule covers arm64"
          fi
          if [ "$arm" = true ]; then
            runners='["ubuntu-24.04","ubuntu-24.04-arm"]'
          else
            runners='["ubuntu-24.04"]'
            echo "::notice title=engine-matrix amd64 only::${reason}"
          fi
          echo "runners=${runners}" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo
            echo "- suites: \`${SUITES}\`"
            echo "- Engines (test/matrix/engines.json): \`${engines}\`"
            echo "- runners: \`${runners}\`${reason:+ — **amd64 only:** ${reason}}"
          } >> "$GITHUB_STEP_SUMMARY"

  race:
    name: race
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',race,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        # The race detector needs cgo; the SQLite driver stays pure Go (modernc).
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  metrics-budget:
    # The #5 scale budget (25 environments, 1 000 containers, 20 UI
    # sessions): ingest, rollup and dashboard-query benchmarks of the
    # metrics store with GOMAXPROCS=2 (a 2 vCPU manager), plus the storage
    # footprint per row. Numbers: docs/architecture/metrics.md.
    name: metrics-budget
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',metrics-budget,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Metrics store benchmarks (GOMAXPROCS=2)
        run: |
          go test -run '^TestScaleBudget$' -bench . -benchtime 10x -cpu 2 -count=1 -timeout 25m ./internal/manager/metrics/ 2>&1 \
            | grep -v 'testutil.go' | tee metrics-budget.log
          {
            echo "### metrics-budget (GOMAXPROCS=2)"
            echo
            echo '```'
            grep -E '^(Benchmark|ok|FAIL|---)' metrics-budget.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: fuzz
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',fuzz,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FUZZTIME: ${{ inputs.fuzztime || '60s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz every FuzzXxx target
        run: bash scripts/ci/fuzz-all.sh
      - name: Upload new corpus entries
        if: failure()
        uses: https://data.forgejo.org/forgejo/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
            ${{ runner.temp }}/fuzz-cache/**
          if-no-files-found: ignore
          retention-days: 30

  engine-matrix:
    name: engine-matrix (${{ matrix.engine }}, ${{ matrix.runner }})
    needs: plan
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',engine-matrix,')
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # TestEngineAgentImage runs the real agent image inside the DinD Engine (#2, #21).
      - name: Build the agent image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          load: true
          tags: dockyard-agent:test
          build-args: |
            VERSION=0.0.0-test
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=agent
      - name: Engine tests (TestEngine*)
        env:
          DOCKYARD_TEST_ENGINE: ${{ matrix.engine }}
          DOCKYARD_TEST_AGENT_IMAGE: dockyard-agent:test
        run: go test -tags integration -count=1 -timeout 25m -run '^TestEngine' -v ./... 2>&1 | tee engine-tests.log
      # Environment migration (#35): the manager or the source agent killed
      # mid-transfer on real Engines (fault point migration.part.verified).
      - name: Migration kill tests (TestEngine*KilledMidTransfer, -tags integration,faultinject)
        env:
          DOCKYARD_TEST_ENGINE: ${{ matrix.engine }}
          DOCKYARD_TEST_AGENT_IMAGE: dockyard-agent:test
        run: go test -tags integration,faultinject -count=1 -timeout 25m -run 'KilledMidTransfer$' -v ./internal/manager/migrations/ 2>&1 | tee migration-kill-tests.log
      - name: Results per operation
        if: always()
        run: |
          # Per-Engine evidence for docs/support-matrix.md (#21, #25 Q2):
          # every TestEngine* test and subtest (one per v1 operation), incl.
          # two agents on two Engines (TestEngineTwoAgentsEnrollAndServeJobs, #3).
          # No engine-matrix checks are pending.
          {
            echo "### engine-matrix ${{ matrix.engine }} on ${{ matrix.runner }}"
            echo
            echo '```'
            grep -E '^\s*--- (PASS|FAIL|SKIP)|^\s+fixtures_integration_test.go:[0-9]+: Engine |^(ok|FAIL)\s' engine-tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compose-fixtures:
    name: compose-fixtures
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',compose-fixtures,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The storage-layout tests (#28) run the real agent image inside DinD.
      - name: Build the agent image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          load: true
          tags: dockyard-agent:test
          build-args: |
            VERSION=0.0.0-test
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=agent
      - name: Registry, Git server and Compose tests
        env:
          DOCKYARD_TEST_AGENT_IMAGE: dockyard-agent:test
        run: go test -tags integration -count=1 -timeout 25m -run '^Test(Registry|Git|Compose)' -v ./... 2>&1 | tee compose-tests.log
      - name: Results and manual checks
        if: always()
        run: |
          # Covered above: Compose fixtures (TestCompose*), stack deploys on one
          # and two hosts (#7), the identical-path layout (#28), Git builds on
          # two Engines (#33), private-registry pulls, digest updates on two
          # agents and the registry connection test (#19, #20). Authenticated
          # Docker Hub pulls need a real account: manual procedure V52m in
          # docs/testing/verification-matrix.md.
          msg="authenticated Docker Hub pulls on two agents are a manual release check (verification matrix V52m)"
          echo "::notice title=compose-fixtures manual checks::${msg}"
          {
            echo '```'
            grep -E '^\s*--- (PASS|FAIL|SKIP)|^(ok|FAIL)\s' compose-tests.log || true
            echo '```'
            echo "Manual: ${msg}"
          } >> "$GITHUB_STEP_SUMMARY"

  storage:
    name: storage
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',storage,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: MinIO and restic tests
        env:
          DOCKYARD_TEST_CACHE: ${{ runner.temp }}/dockyard-test-cache
        # Local and S3 (MinIO) backup, retention, verification of a damaged
        # repository and restore through the agent's executors
        # (TestBackupRunWithRealRestic*, TestRestoreWithRealRestic, #10, #28),
        # clean-manager import with the Recovery Key across two host
        # repositories (TestBackupImportWithRealRestic*, #24). Corrupt and
        # truncated manifests are unit-tested in the PR suite.
        run: go test -tags integration -count=1 -timeout 25m -run '^Test(MinIO|Restic|Storage|Backup|Restore)' -v ./...

  fs-security:
    name: fs-security
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',fs-security,')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Corpus generator, reference containment and TOCTOU race
        run: go test -count=1 -race -v ./internal/testutil/fscorpus/...
        env:
          CGO_ENABLED: "1"
      - name: Consumers of the corpus
        run: |
          mapfile -t consumers < <(grep -rl --include='*_test.go' 'internal/testutil/fscorpus' . | grep -v '^./internal/testutil/fscorpus/' || true)
          if [ "${#consumers[@]}" -eq 0 ]; then
            echo "no consumers yet"
          else
            printf '%s\n' "${consumers[@]}" | xargs -n1 dirname | sort -u | sed 's|^\./|./|' | xargs go test -count=1 -v
          fi
          echo "consumers=${#consumers[@]}" >> "$GITHUB_OUTPUT"
        id: consumers
      # Linux-only symlink escape trees and TOCTOU races of the file manager
      # (internal/agent/files) run in the consumers step above; migration and
      # restore extraction (TestExtractRefusesUnsafeMembers,
      # TestArchiveSlipAndSpecialEntries) and missed fsnotify events
      # (internal/agent/watch: TestMissedEventReconciliation,
      # TestInotifyOverflowReconciles) run here with the race detector too.
      - name: Extraction and watcher corpora (race)
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./internal/agent/migration/... ./internal/agent/watch/... ./internal/agent/backups/...
      - name: Summary
        if: always()
        run: |
          echo "fs-security corpus consumers: ${{ steps.consumers.outputs.consumers || 0 }}" >> "$GITHUB_STEP_SUMMARY"

  fault-injection:
    name: fault-injection
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',fault-injection,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests built with -tags faultinject
        id: tagged
        run: |
          mapfile -t files < <(grep -rlE --include='*.go' '^//go:build .*faultinject' . || true)
          echo "files=${#files[@]}" >> "$GITHUB_OUTPUT"
          printf 'faultinject-tagged file: %s\n' "${files[@]}"
          go test -tags faultinject -count=1 -timeout 25m ./...
      - name: Subprocess kill suites
        id: kill
        run: |
          # Suites that start the real binaries and kill them mid-job live in
          # test/fault (tag integration or faultinject) and are named TestKill*/TestCrash*.
          if [ -d test/fault ]; then
            go test -tags integration,faultinject -count=1 -timeout 25m -run '^Test(Kill|Crash)' -v ./test/fault/...
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "no subprocess kill suites (test/fault) yet"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        if: always()
        run: |
          # Covered above: TestKillAtEveryStage (simulated deploy/backup/prune/
          # retention/manager-backup jobs) and TestKillRealExecutorsAtEveryStage
          # (the real deploy, backup-with-shutdown and prune executors over
          # persisted fake Engines) kill the manager or the agent at every
          # fault point (#26). Reconnects, event gaps and clock skew are
          # Docker-free unit tests in the PR suite (TestReconnectReconcilesRunningJob,
          # TestRelaySequenceAndGaps, TestLossesBecomeResets,
          # TestClockSkewIsCorrectedAndFlagged, scheduler TestClockJumps); the
          # migration kill tests on real Engines run in engine-matrix.
          echo "faultinject-tagged files: ${{ steps.tagged.outputs.files || 0 }}, kill suites ran: ${{ steps.kill.outputs.ran || false }}" >> "$GITHUB_STEP_SUMMARY"

  secret-canary:
    name: secret-canary
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',secret-canary,')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Canary helpers and every test that uses them
        id: canary
        run: |
          mapfile -t pkgs < <(grep -rl --include='*_test.go' 'internal/testutil/canary' . | xargs -r -n1 dirname | sort -u)
          echo "consumers=$(( ${#pkgs[@]} ))" >> "$GITHUB_OUTPUT"
          go test -count=1 -v ./internal/testutil/canary/... "${pkgs[@]}"
      - name: Summary
        if: always()
        run: |
          # Covered above (every consumer package also runs in the PR suite):
          # passwords and TOTP seeds (#16), API tokens (#31), registry and Git
          # credentials (#19, #33), S3 keys and the Recovery Key (#10, #24),
          # .env values (#7), the audit redaction of every kind (#30) and the
          # support bundle (#34).
          echo "packages using internal/testutil/canary: ${{ steps.canary.outputs.consumers || 0 }}" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',e2e,')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: TLS proxy tests (Go)
        # The harness fixture plus the agent transport through a real TLS
        # proxy (test/proxy, #27).
        run: go test -tags integration -count=1 -timeout 15m -run '^TestTLSProxy' -v ./...
      - name: E2E test routes (Go, -tags e2e)
        run: go test -tags e2e -count=1 -run '^TestE2E' -v ./internal/manager/server/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start managers (built from source) behind Caddy, Traefik and nginx
        run: docker compose -f e2e/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Trust the E2E CA (browser and Node)
        run: |
          docker compose -f e2e/compose.yaml cp certs:/certs/ca.crt e2e/.e2e-ca.crt
          sudo apt-get update -qq && sudo apt-get install -y -qq libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n dockyard-e2e -i e2e/.e2e-ca.crt
          for port in 8443 8444 8445; do
            for i in $(seq 1 60); do
              curl -sS --fail --cacert e2e/.e2e-ca.crt "https://localhost:${port}/api/v1/health/ready" && break
              sleep 2
            done
            curl -sS --fail --cacert e2e/.e2e-ca.crt "https://localhost:${port}/api/v1/health/ready"
            echo
          done
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
      - name: Playwright
        working-directory: e2e
        env:
          CI: "1"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/e2e/.e2e-ca.crt
          # topology.spec.ts leaves the enrollment token it created in the
          # UI for the agent-session step below.
          E2E_ENROLLMENT_TOKEN_DIR: ${{ runner.temp }}/e2e-enrollment-tokens
        run: npx playwright test
      - name: Agent sessions, exec and reconnects through each proxy (Go)
        # Real agent enrollment/transport/session code against the managers
        # behind Caddy, Traefik and nginx (test/proxy, #27): UI token, exec
        # WebSocket idle and reattach, live-stream resume, session reconnect
        # after a cut connection and a restart, co-located plain-HTTP agent.
        if: success() || failure()
        env:
          E2E_PROXY_STACK: "1"
          E2E_CA_FILE: ${{ github.workspace }}/e2e/.e2e-ca.crt
          E2E_ENROLLMENT_TOKEN_DIR: ${{ runner.temp }}/e2e-enrollment-tokens
        run: go test -tags integration -count=1 -timeout 15m -run '^TestTLSProxyAgentSessions$' -v ./test/proxy/
      - name: Upload Playwright report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Compose logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs --no-color --timestamps
      - name: Scope
        if: always()
        run: |
          # This stack has no seeded environments: the UI track specs run
          # their seeded steps in e2e-devstack (including TOTP, recovery code
          # and passkey sign-in, live updates across two sessions and the
          # narrow layouts), the terminal specs in smoke against a real
          # Engine. Agent sessions, exec and reconnects through each proxy
          # are TestTLSProxyAgentSessions above (scripted Engine).
          msg="seeded UI specs run in e2e-devstack; real-Engine terminal specs in smoke"
          echo "::notice title=e2e scope::${msg}"
          echo "Scope: ${msg}" >> "$GITHUB_STEP_SUMMARY"

  e2e-devstack:
    # The Playwright UI specs against test/devstack (a real manager with
    # in-process agents over fake Engines, seeded homelab): each spec on a
    # fresh devstack, plus first-run setup, sign-in factors (TOTP, recovery
    # code, passkey) and the fresh-manager import. scripts/ci/e2e-devstack.sh.
    name: e2e-devstack
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',e2e-devstack,')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install web and Playwright
        run: |
          npm ci --prefix web
          npm ci --prefix e2e
          (cd e2e && npx playwright install --with-deps chromium && npm run typecheck)
      - name: Playwright against the devstack
        env:
          CI: "1"
          E2E_DEVSTACK_ARTIFACTS: ${{ runner.temp }}/devstack
        run: bash scripts/ci/e2e-devstack.sh
      - name: Upload devstack logs and Playwright results
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: e2e-devstack
          path: |
            ${{ runner.temp }}/devstack/*.log
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: smoke
    if: github.event_name != 'workflow_dispatch' || inputs.suites == 'all' || contains(format(',{0},', inputs.suites), ',smoke,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose images
        id: mode
        env:
          INPUT: ${{ inputs.smoke-images }}
        run: |
          mode="${INPUT:-auto}"
          if [ "$mode" = auto ]; then
            if [ "${GITHUB_REF}" = refs/heads/main ]; then mode=edge; else mode=local; fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Smoke images: ${mode}" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Forgejo registry
        if: steps.mode.outputs.mode == 'edge'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: code.neureka.dev
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build manager image (local)
        if: steps.mode.outputs.mode == 'local'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/manager.Dockerfile
          load: true
          tags: dockyard-manager:smoke
          build-args: |
            VERSION=0.0.0-smoke
            REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=manager
      - name: Build agent image (local)
        if: steps.mode.outputs.mode == 'local'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          load: true
          tags: dockyard-agent:smoke
          build-args: |
            VERSION=0.0.0-smoke
            REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agent
      - name: Owner password for the Playwright terminal specs
        run: |
          # Random per run and masked: the smoke owner signs in with it, and
          # so does Playwright; it is never written to a file.
          pw="smoke-$(openssl rand -hex 24)"
          echo "::add-mask::${pw}"
          echo "SMOKE_OWNER_PASSWORD=${pw}" >> "$GITHUB_ENV"
      - name: Deploy smoke test
        env:
          SMOKE_IMAGES: ${{ steps.mode.outputs.mode }}
          SMOKE_REVISION: ${{ inputs.smoke-revision || github.sha }}
          # Read-only: fetches main to compare commits when :edge has moved
          # on to a newer main.
          SMOKE_GIT_TOKEN: ${{ github.token }}
          SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke
          # Keep the deployment with a deployed stack for the terminal specs.
          SMOKE_E2E_ENV: ${{ runner.temp }}/smoke-e2e.env
        run: bash scripts/smoke/deploy-smoke.sh
      # Container logs and terminals through Caddy against a real Engine (#8,
      # #22 track B3): the specs the agent-less e2e stack and the Docker-free
      # devstack cannot run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright terminal specs against the smoke deployment
        working-directory: e2e
        env:
          CI: "1"
          E2E_ENV_FILE: ${{ runner.temp }}/smoke-e2e.env
        run: |
          set -a
          # shellcheck disable=SC1090 # written by the smoke test's e2e-fixture step
          . "$E2E_ENV_FILE"
          set +a
          sudo apt-get update -qq && sudo apt-get install -y -qq libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n dockyard-smoke -i "$E2E_CA_FILE"
          npm ci
          npx playwright install --with-deps chromium
          E2E_TERMINAL_PASSWORD="$SMOKE_OWNER_PASSWORD" NODE_EXTRA_CA_CERTS="$E2E_CA_FILE" \
            npx playwright test --workers=1 tests/terminal.spec.ts tests/ui-terminal.spec.ts
      - name: Tear down the smoke deployment
        if: always()
        env:
          SMOKE_IMAGES: ${{ steps.mode.outputs.mode }}
          SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke
        run: bash scripts/smoke/deploy-smoke.sh teardown
      - name: Upload smoke logs
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
