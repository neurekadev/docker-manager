# Serves the static documentation export (/app/site) on port 3000.
# __BASE__ is the site's path (DOCS_BASE_PATH, e.g. /docker-manager, or
# empty at the domain's root); the Dockerfile fills it in.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 3000;
        listen [::]:3000;
        root /app/site;
        index index.html;

        # Behind a reverse proxy nginx only knows its own port (3000): send
        # relative redirects (/docs -> /docs/) so the browser keeps the
        # public host, scheme and port.
        absolute_redirect off;

        # The exported local search index has no file extension.
        # Without a base path this is "location = /" and is removed.
        location = / {
            return 302 __BASE__/;
        }

        # The docs used to live under /docs/: keep old links working.
        location = __BASE__/docs {
            return 301 __BASE__/overview/;
        }
        location = __BASE__/docs/ {
            return 301 __BASE__/overview/;
        }
        location __BASE__/docs/ {
            rewrite ^__BASE__/docs/(.*)$ __BASE__/$1 permanent;
        }

        location = __BASE__/api/search {
            default_type application/json;
        }

        location __BASE__/_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 __BASE__/404.html;
    }
}
