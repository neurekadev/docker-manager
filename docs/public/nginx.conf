# Serves the static documentation export (/app/site) on port 3000.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 3000;
        listen [::]:3000;
        root /app/site;
        index index.html;

        # Behind a reverse proxy nginx only knows its own port (3000): send
        # relative redirects (/docs -> /docs/) so the browser keeps the
        # public host, scheme and port.
        absolute_redirect off;

        # The exported local search index has no file extension.
        location = /api/search {
            default_type application/json;
        }

        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 /404.html;
    }
}
