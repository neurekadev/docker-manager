# Sample stack deployed by the deploy smoke test (scripts/smoke/deploy-smoke.sh)
# once stack deployment (#7) exists. Pinned by digest; uses a relative bind
# mount next to compose.yaml (#28) and a healthcheck.
name: dockyard-smoke-sample

services:
  web:
    image: nginx:1.30.5-alpine3.24-slim@sha256:32463212baf0e7d91aded2e9b843a4f2b9e017804b8c9d5bae7b51dcef64389c
    volumes:
      - ./html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
