# Docker Manager public API route inventory (#4).
#
# One entry per /api/v1 operation in the #4 endpoint catalog, including the
# ones not implemented yet. internal/manager/api/inventory reconciles it with
# the served OpenAPI document (TestRouteInventory):
#   - every operation in the spec must be listed here as implemented, with
#     the same operationId, capability (x-docker-manager-capability), selector
#     values (x-docker-manager-capability-values), scope (x-docker-manager-scope) and kind;
#   - every implemented entry must be in the spec; planned entries must not;
#   - every capability key (and selector value) must exist in the #17
#     permission catalog (internal/manager/authz/catalog); a route without a
#     catalog capability fails TestRouteInventory.
# Feature workstreams flip status to implemented in the PR that registers the
# operation (and may refine capability/scope with #17). Fields:
#   method, path, operationId  stable identity; operation IDs never change
#   capability  public | authenticated | owner | <dotted key> | <prefix>.{selector}
#   capabilityValues  concrete keys of a selector capability
#   scope       none | instance | environment | resource
#   owner       issue number of the workstream that implements the route
#   kind        json | stream (SSE or bounded binary body) | websocket
#   status      planned | implemented
#   sessionOnly true for routes API tokens (#31) can never call (sign-in and
#               factor flows, token management, Recovery Key administration);
#               owner routes and owner-only capabilities never accept tokens
#               and do not set it. Checked against the spec's security.
# The private agent routes are listed under agentRoutes; they are specified
# in docs/protocol/agent-v1.md, not in the public OpenAPI document.
version: 1
